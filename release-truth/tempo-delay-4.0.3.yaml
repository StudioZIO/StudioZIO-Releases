# StudioZIO Tempo Delay 4.0.3 — Standalone microphone fix, clean installer
# payload (2026-09-26).
# The Standalone declares NSMicrophoneUsageDescription and is signed with the
# com.apple.security.device.audio-input entitlement, so macOS asks for
# microphone access under the hardened runtime instead of denying live input.
# One version number: bundles, installer, component receipts and package name
# are all 4.0.3. All four formats come from one -G Xcode build and the package
# from the canonical release pipeline (scripts/release_driver.sh) run from a
# clean Terminal.app process; its payload carries no AppleDouble or .DS_Store
# record.
# 4.0.2 was notarized but never published: its payload carried 50 AppleDouble
# records (com.apple.provenance), see tempo-delay-4.0.2.yaml.
# 4.1.0 was not produced from a single build: its signed bundles were reused
# from the 4.0.1-AAX package and its source root was assembled outside the
# repository (StudioZIO-Verification/Everything-Phase1/tempodelay/lift-job.sh).
# Published on its own on 2026-09-26 (GitHub release tempo-delay-v4.0.3);
# StudioZIO Everything 1.0.3 follows on 2026-09-29.
supersedes:
  manifest: tempo-delay-4.1.0-clean-packaging-2026.09.16.yaml
  artifact_sha256: fa16f0c9f04f5f56e446ae06074a0f3b0a8e193fa21089e0bf92c486d197910d
  status: SUPERSEDED_ARTIFACT
  reason: >-
    4.1.0 carries the 4.0.1 Standalone, which has no microphone usage text and
    no audio-input entitlement, so live input is denied under the hardened
    runtime. It was also not produced from a single build.

previous_candidates:
  - manifest: tempo-delay-4.0.2.yaml
    artifact_sha256: 8518a2446d697ddacbf6aaac30833eea49d537e1d610a875784214a59b878e18
