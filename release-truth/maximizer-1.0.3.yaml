# StudioZIO Maximizer 1.0.3 — Standalone microphone-permission and branding
# hotfix. Built, signed, PACE-wrapped and packaged by the full canonical
# pipeline (Distribution/Maximizer.cmake, SIGNED mode) from a clean
# Terminal.app process. 1.0.0-1.0.2 bundles were hand-assembled and never
# passed SignBundles, so the hardened-runtime Standalone shipped without
# NSMicrophoneUsageDescription and without the audio-input entitlement and
# could not open live input (clean QA, StudioZIOQA, macOS 26.5.2).
# 1.0.2 (69510b08...eedfe, maximizer-1.0.2-clean-packaging-2026.09.16.yaml)
# remains historical canonical evidence and is not modified.
# Not published: no GitHub release, tag, website or KVR action.
