# StudioZIO Tempo Delay 4.0.2 — Standalone microphone fix (2026-09-26).
# The Standalone declares NSMicrophoneUsageDescription and is signed with the
# com.apple.security.device.audio-input entitlement, so macOS asks for
# microphone access under the hardened runtime instead of denying live input.
# One version number: bundles, installer, component receipts and package name
# are all 4.0.2 (owner decision; the 4.1.0 installer number was a mistake).
# All four formats come from one -G Xcode build of StudioZIO-Tempo-Delay and
# pass through stage_rc.sh -> sign_release.sh -> build_pkg.sh. The 4.1.0
# package was not produced from a single build: its signed bundles were reused
# from the 4.0.1-AAX package and assembled outside the repository.
# Not published: no GitHub release, tag, website, Homebrew or KVR action.
supersedes:
  manifest: tempo-delay-4.1.0-clean-packaging-2026.09.16.yaml
  artifact_sha256: fa16f0c9f04f5f56e446ae06074a0f3b0a8e193fa21089e0bf92c486d197910d
  status: SUPERSEDED_ARTIFACT
  reason: >-
    4.1.0 carries the 4.0.1 Standalone, which has no microphone usage text and
    no audio-input entitlement, so live input is denied under the hardened
    runtime. 4.1.0 was also not produced from a single build: its signed
    bundles were reused from the 4.0.1-AAX package, and its source root was
    assembled outside the repository
    (StudioZIO-Verification/Everything-Phase1/tempodelay/lift-job.sh).

